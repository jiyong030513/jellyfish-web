# 화면 테마: 바다 느낌의 남색·청록, 흰 배경 (python app.py로 실행하면 이 폴더에서 읽음)
[theme]
base = "light"
primaryColor = "#0E7C86"              # 청록: 버튼·선택·강조
backgroundColor = "#FFFFFF"           # 흰 배경
secondaryBackgroundColor = "#F3F8FB"  # 사이드바·입력칸
textColor = "#0B2545"                 # 남색 글자
font = "sans serif"

[browser]
gatherUsageStats = false
